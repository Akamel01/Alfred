# Four migration environments, one per schema, each under its own role.
#
#   uv run alembic -n product  upgrade head
#   uv run alembic -n control  upgrade head
#   uv run alembic -n evidence upgrade head
#   uv run alembic -n heldout  upgrade head
#
# They are separate rather than one environment with four schemas because a single
# environment covering `evidence` and `heldout` would need a role holding both, and
# that role would be the boundary's single point of collapse
# (docs/tier1/data-architecture.md § Migration layout).
#
# No URL appears in this file. Each env.py reads a role-specific environment variable
# from the secret store; a connection string here is a credential in version control.
#
# Version tables live in `migration_meta`, never in the schema being migrated: Alembic
# UPDATEs its version table on every migration, and `evidence` grants no UPDATE to
# anyone.

[alembic]
# Placeholder: every real invocation uses -n. Alembic requires the section to exist.
script_location = migrations/product
prepend_sys_path = .

[product]
script_location = migrations/product
prepend_sys_path = .

[control]
script_location = migrations/harness/control
prepend_sys_path = .

[evidence]
script_location = migrations/harness/evidence
prepend_sys_path = .

[heldout]
script_location = migrations/harness/heldout
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
