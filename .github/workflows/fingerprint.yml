name: "Capture Run Fingerprint"

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Capture run fingerprint
        run: just fingerprint --seed ${{ github.run_number }}

      - name: Upload fingerprint artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-fingerprints-${{ github.run_number }}
          path: bench/fingerprints/*.json
          retention-days: 90