# Alfred — the gates the register declares.
#
# Every document carrying `enforcement: ci-gate` points here. If a check a document
# names is not in this file, that document's enforcement value is a wish and the
# document is falsified by its own frontmatter.
#
# Ordering is load-bearing. Integrity checks run FIRST, before any suite reports a
# number: a tampered vectors.json or a stale register makes every subsequent green
# tick meaningless, and a suite that passes against corrupted fixtures is exactly the
# failure the ACS-1 mutation control was built to catch.
#
# This workflow runs no product code and touches no credential. It is inspector
# machinery (D20): agents may not edit it.

name: gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned. A gate whose toolchain floats is not a gate — the same argument D40 makes
  # about the inference lane, applied to the thing that checks it.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "26"

jobs:
  # ---------------------------------------------------------------- integrity first
  integrity:
    name: integrity (fixtures and register)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies from the lockfile
        # --frozen: the lockfile is a fingerprint field (A6). A gate that silently
        # resolves a different closure is measuring a different system.
        run: uv sync --frozen --all-extras --dev

      # The register's completeness checks. These caught real drift on 2026-08-13 —
      # a document added without an index entry — which is the only evidence in this
      # project that the completeness check works.
      - name: Document header contract
        run: python3 scripts/lint_docs.py --check

      - name: Reading map current
        run: python3 scripts/gen_reading_map.py --check

      # ADR number claim lint. The log is append-only and its numbers never reuse,
      # but the claim half of that discipline was enforced nowhere: the collision was
      # discovered at merge and paid for by hand — the fa62b4b collision paid twice in
      # one week (0029 to 0031, 0031 to 0032). This fails a branch that re-claims a
      # number the base has issued, or carries one twice, and prints — never fails — a
      # deliberate gap, whose committed home is the vault's adr-numbering-gap anomaly.
      - name: ADR numbers are claimed once
        run: python3 scripts/lint_adr_numbers.py

      # Its own negative control, run first-class rather than trusted, for the same
      # reason the verdict-boundary lint's is.
      - name: ADR number lint detects planted collisions
        run: python3 scripts/lint_adr_numbers.py --self-test

      # Additive-only over migrations/harness/{evidence,heldout}/versions/. Second
      # layer over the grant matrix: the grant makes the destructive write impossible
      # for every role that runs; this catches the migration that would grant itself
      # the ability by owning the table. Reports "0 migrations" distinctly from a
      # pass — an empty guard must not read as a green one.
      - name: Migrations are additive-only
        run: python3 scripts/lint_migrations.py

      # D16/D39. LangGraph raises only on *concurrent* unreducered writes, so a
      # sequential write to a verdict field is silent and the boundary is a
      # convention unless something checks it. Three directions: the vocabulary in
      # the agent tree, the agent tree reaching a verdict module transitively, and a
      # verdict module reaching the agent tree. A check that scanned zero files fails
      # rather than passing.
      - name: Verdict boundary holds
        run: python3 scripts/lint_verdict_boundary.py

      # The lint's own negative control, run first-class rather than trusted. A lint
      # with no planted violation reports the same thing whether it works or not.
      - name: Verdict boundary lint detects planted violations
        run: python3 scripts/lint_verdict_boundary.py --self-test

      # ACS-1 test vectors are the published specification (ADR-0004), so a
      # hand-edited vectors.json would silently redefine the standard the evidence
      # chain is audited against.
      #
      # `gen_vectors.py` takes no flags and rewrites in place, so the check must
      # snapshot, regenerate, and compare. Running the generator and then running the
      # suite would pass on a tampered committed file — the suite would be checking
      # the freshly written bytes, not the committed ones.
      # Enumeration drift, in the two places this repository has it: test directories that
      # no step names, and the F1-F28 fail-closed rows against their register. Both read
      # green while broken, because an enumeration that is missing an entry looks exactly
      # like one that is complete.
      - name: CI coverage (test directories, failure register)
        run: python3 scripts/lint_ci_coverage.py

      # Its own negative control, run first-class rather than trusted, for the same reason
      # the verdict-boundary lint's is.
      - name: CI coverage lint detects planted violations
        run: python3 scripts/lint_ci_coverage.py --self-test

      # How much of `harness/` the lint gate collects, and whether that gate can go red.
      # `[tool.ruff].include` reaches no file under `harness/`, and ruff answers a path it
      # collects nothing from with "No Python files found" and exit 0 -- indistinguishable
      # from a clean tree. That is the ADR-0007 vacuity class in the tooling, and it is how
      # the tree that verifies every other tree came to be verified by nothing.
      #
      # The coverage floor is 0 today and the run prints "0 of 74". That is a recorded
      # measurement, not a passing grade, in the same shape as the twenty-four
      # `not-yet-injected` rows above: raising it is OBSERVER-1 under ADR-0029, and until it
      # is answered what this step forbids is drift -- coverage going down, or the disk scan
      # going quiet. The count is in the output of every run, so the hole is read, not hidden.
      - name: Harness lint coverage
        run: python3 scripts/lint_harness_gate.py

      # The gate seen red. Plants F401 in a collected harness-shaped file and requires that
      # rule, at that path, to be reported -- and requires the clean arm to stay quiet, so a
      # detector that reports red unconditionally fails here rather than passing everywhere.
      - name: Harness gate detects planted violations
        run: python3 scripts/lint_harness_gate.py --self-test

      # Stage gate REGISTER integrity, not the exit gate. The exit gate is
      # `--gate phase0` and is run when exit is claimed: it reports red from the day it
      # is written until the day the phase ends, and a check that is red for reasons
      # nobody reads is a check that gets turned off. This step asserts the record is
      # well formed -- every criterion in the document registered, every `met` naming
      # evidence that resolves, every unmet carrying a reason.
      - name: Stage gate register integrity
        run: python3 scripts/lint_stage_gates.py

      - name: Stage gate lint detects planted violations
        run: python3 scripts/lint_stage_gates.py --self-test

      - name: ACS-1 vectors regenerate byte-identically
        run: |
          set -euo pipefail
          before="$(shasum -a 256 harness/acs/vectors.json | cut -d' ' -f1)"
          python3 harness/acs/gen_vectors.py > /dev/null
          after="$(shasum -a 256 harness/acs/vectors.json | cut -d' ' -f1)"
          if [ "$before" != "$after" ]; then
            echo "vectors.json is not what gen_vectors.py produces."
            echo "  committed:   $before"
            echo "  regenerated: $after"
            echo "Either the generator changed without regenerating, or the file was hand-edited."
            git --no-pager diff --stat -- harness/acs/vectors.json || true
            exit 1
          fi
          echo "byte-identical: $after"

      # The vault and the published graph are derived from the repository and authored
      # nowhere. That property is what admits them as a read model under D44/D47/D51 rather
      # than an unfingerprinted write path into agent context — and it is a property only a
      # check can hold. Every generated note says "do not edit"; without this step that
      # sentence is a wish.
      #
      # --self-test runs first and deliberately: it proves the vacuity guards fire before
      # --check is trusted to mean anything. A generator whose extractors silently matched
      # nothing would emit a smaller vault, --check would compare it against itself, and both
      # would pass. That is the failure this project has paid for four times (ADR-0012,
      # ADR-0013), arriving through a new door.
      - name: Vault generator detects its own vacuity
        run: python3 tools/gen_vault.py --self-test

      # --check fails three ways: a note that differs, a note that is missing, and a note
      # nobody planned. The third is the one content comparison alone cannot see — a
      # hand-edited note differs from its planned text, but a hand-created one has no planned
      # text to differ from, and both are the same defect.
      #
      # The plan mirror is verified here too. Where ~/.claude/plans is absent, as it is on
      # every runner, the mirror is checked against its own manifest and that is not a
      # failure; drift is only detectable where the origin exists, and that is the operator's
      # machine.
      - name: Vault and published graph are current
        run: python3 tools/gen_vault.py --check

      - name: Vault generator suites
        # By explicit path: pyproject's testpaths is `tests`, and a documentation generator
        # must not be able to red the product gate.
        run: uv run pytest tools/tests

  # ---------------------------------------------------------------- product gates
  product:
    name: product (lint, types, tests)
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies from the lockfile
        run: uv sync --frozen --all-extras --dev

      # coding-standards.md: ruff and pyright are hard gates, not advisory.
      # PGH is in the select list for codeless ignores; the control that actually
      # rejects a blanket `# type: ignore[code]` is pyright's
      # enableTypeIgnoreComments = false, verified by mutation 2026-08-15.
      - name: ruff
        run: uv run ruff check

      - name: pyright --strict
        run: uv run pyright

      - name: pytest — product
        run: uv run pytest tests

  # ---------------------------------------------------------------- inspector gates
  inspector:
    name: inspector (ACS-1, lane, bench)
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync dependencies from the lockfile
        run: uv sync --frozen --all-extras --dev

      - name: ACS-1 — Python conformance
        run: uv run pytest harness/acs

      # The second implementation is the claim: a third party recomputes Alfred's
      # digests without running Alfred's code (ADR-0003). It runs on stock Node with
      # no dependencies, deliberately — the encoder guarding the audit chain must not
      # depend on the supply chain the chain records.
      - name: ACS-1 — JavaScript conformance
        run: node harness/acs/verify_js.mjs

      - name: bench harness self-tests
        run: uv run pytest bench

      # Lane controls, and the containment probes that need no database: the egress
      # canary (C6) and the oracle-absence probe (C7). Both run against loopback and
      # temporary trees rather than against the runner's network state — a canary suite
      # that depended on the machine's connectivity would pass on an unplugged laptop,
      # which is the one condition under which a canary proves nothing.
      - name: Lane controls
        run: uv run pytest harness/lane

      # C6 and C7 probe for real; C8/C9/C12/C13/C14/C15 are assertions over constructed
      # observations; C1/C2/C3/C5/C10 are shells whose unread holes must report
      # `not_executed`. The suite's own control is that no shell can be made to pass against
      # the most favourable observation available — if it can, the shells are decoration.
      - name: Containment (C6, C7 probes; C8-C15; and the O5 shells that must not pass)
        run: uv run pytest harness/containment

      # S4. The two suites and the three controls that stop them reading green for free.
      # Runs here rather than in the product job: it measures the runner, not the product,
      # and it needs no database — the criterion is synthetic precisely so that a factory
      # gate does not depend on a domain that may be written off.
      - name: Harness self-test (null-agent floor, seeded-defect ladder, controls)
        run: uv run pytest harness/selftest

      # The oracle boundary. The integration test skips without the image, which is
      # correct on a CI runner and is why the unit half carries every refusal separately:
      # a suite whose only real assertion is behind a skip is a suite that does not run.
      - name: Oracle boundary (pins, refusals, admissibility)
        run: uv run pytest harness/oracle

      # S8. The ledger half and the artifact-identity half run everywhere; the three
      # tests that actually deploy skip without the built images, which is correct on a
      # runner and is why every refusal that can be tested without a daemon is.
      - name: Deploy and rollback (ledger, identity, refusals)
        run: uv run pytest harness/deploy

      # S9's domain-neutral half. The Worker port's verdict-vocabulary check and the
      # patch gate both carry planted-violation controls, because a check nobody has
      # watched reject anything is a check that might not be able to.
      - name: Worker port (claim/fault split, containment refusals)
        run: uv run pytest harness/worker

      - name: Patch gate (protected paths, A10 invisibles, import hooks)
        run: uv run pytest harness/patch

      # The stamp and the run fingerprint. Both were absent from this file until
      # `lint_ci_coverage.py` was written to look: `harness/stamp` since c1ca0b4 and
      # `harness/fingerprint` since cff67cc, each passing locally the whole time because the
      # baseline command walks the tree while this file enumerates. The lint is the reason
      # a third omission gets caught before it is a commit old.
      - name: Stamp (version, upstream union, total verifier)
        run: uv run pytest harness/stamp

      - name: Run fingerprint record (field set, derived digest, register agreement)
        run: uv run pytest harness/fingerprint

  # ---------------------------------------------------------------- database
  database:
    name: database (throwaway cluster, roles and grants)
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Node is REQUIRED here, not optional. The restore drill's chain re-walk runs
      # `harness/evidence/verify_chain.mjs` under stock Node: a drill using the Python
      # encoder to check a chain the Python encoder wrote is checking nothing. A runner
      # without Node must fail the job, and `test_node_is_available` makes it fail loudly
      # rather than degrading to a self-referential walk.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --extra db: psycopg is an optional extra so the type and test gates do not
      # depend on a wheel that lags the interpreter.
      - name: Sync dependencies from the lockfile
        run: uv sync --frozen --all-extras --dev

      # Creates a throwaway Postgres per run — random loopback port, tmpfs storage,
      # generated passwords, removed on teardown — applies migrations/roles/ and all
      # four Alembic environments, then verifies the cluster is what it claims to be.
      #
      # ALFRED_REQUIRE_DB=1 turns the local skip into a failure. Without it, a runner
      # whose Docker service failed to start would skip these tests and the run would
      # be green for the one reason that must never produce green.
      - name: Throwaway cluster, roles, grants and migrations
        env:
          ALFRED_REQUIRE_DB: "1"
        run: uv run pytest harness/db

      # The inspector core against the same cluster. EvidenceStore's chain tests stage
      # tampering and forks as the superuser, which is the only way to reach a schema
      # where no role in the matrix holds UPDATE — and is the operator-level compromise
      # append-only alone does not survive.
      # Includes the D-SYNTHETIC restore drill: dump, restore into a second throwaway
      # cluster, and compare four ways with the chain re-walk done by Node.
      #
      # A green run here is NOT "restore verified" for Phase 0 exit. That criterion means
      # a recorded D-PRODUCTION run — the actual off-machine backup restored and compared
      # against the live anchor — which cannot run in CI, because CI has no access to the
      # off-machine target. D-synthetic proves the mechanism; only D-production proves the
      # artifact.
      - name: EvidenceStore, chain re-walk, and the D-synthetic restore drill
        env:
          ALFRED_REQUIRE_DB: "1"
        run: uv run pytest harness/evidence

      - name: CriterionRunner — materialization, execution, verdict composition
        env:
          ALFRED_REQUIRE_DB: "1"
        run: uv run pytest harness/criterion

  # ---------------------------------------------------------------- mutation control
  mutation:
    name: mutation control (the suite's own negative control)
    needs: inspector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Sync dependencies from the lockfile
        run: uv sync --frozen --all-extras --dev

      # 47 mutants, threshold 8 checks, with its own negative control: a no-op mutant
      # reports UNDETECTED rather than "ok", and an absent mutation aborts rather than
      # reading as a suite hole. A passing suite is also what a vacuous suite reports —
      # this is the step that tells them apart.
      #
      # It mutates a copy in a temp directory. An in-place mutation harness plus a
      # stale __pycache__ already produced one false corruption signal in this project.
      # `uv run`, not bare python3: mutate.py shells out to pytest, so the interpreter
      # it runs under must be the one with the project's dependencies. Bare python3
      # fails with "No module named pytest" — and it fails *after* printing the
      # baseline line, which is the shape in which this defect reads as a suite result
      # rather than a harness fault.
      - name: ACS-1 mutation control
        run: uv run python harness/acs/mutate.py
