[project]
name = "alfred"
version = "0.0.0"
description = "Alfred — autonomous software engineering factory, product skeleton (Phase 0)."
requires-python = ">=3.12"
readme = "README.md"

# Runtime closure is deliberately small. Every addition requires a technology
# selection record naming what was rejected (docs/tier2/coding-standards.md).
# FastAPI and uvicorn arrive with S8 under D13. A technology selection record is OWED
# and is not written here: docs/tier1/technology-selection-records.md is `owner: human`,
# and its falsification condition — "a technology is adopted with no corresponding
# record" — is now met until the operator writes one.
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.11",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
]

[project.optional-dependencies]
# The driver is an extra so the type/test gates do not depend on a wheel that
# lags the interpreter. Nothing in the scaffold opens a connection yet.
db = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "hypothesis>=6.120",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Layout is fixed by docs/tier2/coding-standards.md § Structure.
packages = ["src/api", "src/domain", "src/ingest", "src/metrics", "src/provenance", "src/replay", "src/thresholds"]

# --------------------------------------------------------------------------- lint

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# The product tree only, matching [tool.pyright].include. `bench/` and `scripts/` are
# measurement code with different conventions, and linting them from here would make a
# product gate fail for reasons no product change can fix.
#
# `harness/` is a different case and this comment used to state it wrongly. It said the
# tree is protected and "carries its own gates". It is protected; it carries no lint gate
# and no type gate at all, which is what ADR-0029 measured: 866 ruff violations, 236 after
# the S101 ignore `tests/*` already gets, and 311 pyright errors, none of them collected by
# anything. D20 forbids agents *editing* the inspector. Checking is a read and editing is a
# write, so the exclusion above was never D20's decision to make and must not borrow its
# authority. It stands for one reason only, stated plainly: nobody has yet decided how much
# of that debt to pay (OBSERVER-1, ADR-0029). `scripts/lint_harness_gate.py` counts the
# uncollected files on every CI run so the number is read rather than assumed.
include = ["src/**/*.py", "tests/**/*.py", "migrations/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = [
    "A",    # builtin shadowing
    "ANN",  # every signature annotated — coding-standards § Typing
    "ARG",  # unused arguments
    "B",    # bugbear
    "BLE",  # blind except — failure-semantics forbids catch-all handlers
    "C4",
    "E",
    "ERA",  # commented-out code
    "F",
    "I",
    "N",
    "PGH",  # blanket noqa/type-ignore — coding-standards § Suppressions requires a rule code
    "PTH",
    "RET",
    "RUF",
    "S",    # bandit
    "SIM",
    "T20",  # no print in library code
    "TRY",
    "UP",
    "W",
]
ignore = [
    "TRY003",  # long messages outside the exception class: the message is the diagnostic
    "TRY400",  # logging.exception vs logging.error — no logging surface yet
    "N818",    # the taxonomy names the five classes (docs/tier1/failure-semantics.md);
               # `ContractViolationError` would rename a documented class to satisfy a
               # convention, and the taxonomy is the thing tests assert against.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]          # assert is the point of a test
"migrations/*" = ["ANN", "I"] # alembic templates own their own shape

[tool.ruff.lint.isort]
known-first-party = ["domain", "metrics", "provenance", "thresholds"]

# --------------------------------------------------------------------------- types

[tool.pyright]
include = ["src", "tests"]
# Resolve against the project venv rather than whatever interpreter happens to be on
# PATH: without this the dev-group packages are invisible and every strict-mode
# "unknown type" is a false positive that hides a real one.
venvPath = "."
venv = ".venv"
# "." puts `harness` (a namespace package outside the agent tree) on the path so
# provenance can import the ACS-1 encoder rather than reimplement it. "src" is the
# package root: modules are `domain.*`, `metrics.*`, ... per the documented layout.
extraPaths = [".", "src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
# Blanket `# type: ignore` is inert here: pyright does not honour mypy error codes, so
# `# type: ignore[call-arg]` suppresses *every* diagnostic on the line — including ones
# written later — under a code nothing reads. Rule-scoped `# pyright: ignore[rule]` is
# the only admitted form (docs/tier2/coding-standards.md § Suppressions).
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

# --------------------------------------------------------------------------- tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --strict-markers --strict-config"
markers = [
    # Needs Docker and a throwaway Postgres (harness/db/cluster.py). Skipped when
    # Docker is unavailable, unless ALFRED_REQUIRE_DB=1 — which CI sets, so a runner
    # whose Docker failed to start reports red rather than green.
    "db: requires a throwaway Postgres cluster",
]
filterwarnings = ["error"]
