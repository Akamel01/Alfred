<script>
'use strict';
// ---- camera (verbatim from tools/vaultgraph/render/camera.py) ----------------
const camera = (function () {
  let tx = 0, ty = 0, scale = 1;
  let animation = null;
  function trimmed(values) {
    const sorted = [...values].sort((a, b) => a - b);
    const cut = Math.floor(sorted.length * 0.01);
    return [sorted[cut], sorted[sorted.length - 1 - cut]];
  }
  return {
    get scale() { return scale; },
    apply(context) {
      context.translate(tx, ty);
      context.scale(scale, scale);
    },
    toWorld(event, element) {
      const rect = element.getBoundingClientRect();
      return {
        x: (event.clientX - rect.left - tx) / scale,
        y: (event.clientY - rect.top - ty) / scale,
      };
    },
    fit(nodes, width, height) {
      if (!nodes.length) return;
      const [minX, maxX] = trimmed(nodes.map(n => n.x));
      const [minY, maxY] = trimmed(nodes.map(n => n.y));
      const spanX = (maxX - minX) || 1;
      const spanY = (maxY - minY) || 1;
      scale = Math.min(width / (spanX + 90), height / (spanY + 90), 2.4);
      tx = width / 2 - ((maxX + minX) / 2) * scale;
      ty = height / 2 - ((maxY + minY) / 2) * scale;
    },
    centre(node, width, height) {
      tx = width / 2 - node.x * scale;
      ty = height / 2 - node.y * scale;
    },
    panBy(dx, dy) { tx += dx; ty += dy; },
    zoomAt(px, py, factor) {
      const next = Math.min(6, Math.max(0.18, scale * factor));
      tx = px - (px - tx) * (next / scale);
      ty = py - (py - ty) * (next / scale);
      scale = next;
    },
    tween(node, targetScale, width, height, onFrame) {
      if (animation) cancelAnimationFrame(animation);
      const fromX = tx, fromY = ty, fromScale = scale;
      const toScale = Math.min(6, Math.max(0.18, targetScale));
      const toX = width / 2 - node.x * toScale;
      const toY = height / 2 - node.y * toScale;
      const started = performance.now();
      const span = 380;
      const step = now => {
        const t = Math.min(1, (now - started) / span);
        const eased = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        tx = fromX + (toX - fromX) * eased;
        ty = fromY + (toY - fromY) * eased;
        scale = fromScale + (toScale - fromScale) * eased;
        onFrame();
        animation = t < 1 ? requestAnimationFrame(step) : null;
      };
      animation = requestAnimationFrame(step);
    },
  };
})();

// ---- data -------------------------------------------------------------------
const TOPO = JSON.parse(document.getElementById('topology-data').textContent);
const PAL = JSON.parse(document.getElementById('palette-data').textContent);
const paletteById = new Map(PAL.nodes.map(n=>[n.id,n]));
const nodes = TOPO.nodes.map(n=>({id:n.id,kind:n.kind,label:n.label||n.kind,x:n.position.x,y:n.position.y,degree:0}));
const edges = TOPO.edges.map(e=>({id:e.id,source:e.source,target:e.target,source_port:e.source_port,target_port:e.target_port,contract:e.contract,label:e.label||''}));
const byId = new Map(nodes.map(n=>[n.id,n]));
let nextNodeId = nodes.length+1;
let nextEdgeId = edges.length+1;
const CONTRACTS = ['delegates-to','hands-off-to','reviews','feeds'];
const CONTRACT_COLOR = {'delegates-to':'#2563eb','hands-off-to':'#059669','reviews':'#d97706','feeds':'#7c3aed'};
const CATEGORY_ORDER = ['planning','execution','review','operator'];

function recomputeDegrees(){
  nodes.forEach(n=>n.degree=0);
  edges.forEach(e=>{
    const s=byId.get(e.source),t=byId.get(e.target);
    if(s) s.degree+=1; if(t) t.degree+=1;
  });
}
recomputeDegrees();

function legalContracts(sourceKind,targetKind){
  const s=paletteById.get(sourceKind), t=paletteById.get(targetKind);
  if(!s||!t) return [];
  const out=new Set(s.ports.out||[]), inn=new Set(t.ports.in||[]);
  return CONTRACTS.filter(c=>out.has(c)&&inn.has(c));
}
function isCompatible(sKind,tKind,contract){
  return legalContracts(sKind,tKind).includes(contract);
}

// ---- rendering helpers ------------------------------------------------------
const canvas = document.getElementById('stage-canvas');
const ctx = canvas.getContext('2d');
const inspector = document.getElementById('inspector');
let selected = null; // {type:'node'|'edge', id}
let hoverPort = null;
let connectDrag = null; // {fromNode, contract, startWorld, curWorld, ctrlCycle}
let panDrag = null; // {x,y,moved}
let nodeDrag = null; // {node, offX, offY}
let hoverNode = null;
let hoverEdge = null;
const GRID=20;

function radiusOf(n){ return 16 + Math.min(13, Math.sqrt(Math.max(0,n.degree))*2.6); }
function nodeColor(kind){
  const p=paletteById.get(kind);
  if(!p) return '#9a9590';
  const map={planning:'#3b82f6',execution:'#059669',review:'#d97706',operator:'#7c3aed'};
  return map[p.category]||'#6b7280';
}
function portPositions(node){
  const r=radiusOf(node);
  const pal=paletteById.get(node.kind);
  if(!pal) return {in:[],out:[]};
  const outs=(pal.ports.out||[]).map((c,i,arr)=>{
    const n=arr.length; const frac=n===1?0.5:(i/(n-1));
    const ang = -Math.PI*0.35 + frac*Math.PI*0.7; // east fan
    return {name:c,side:'out',contract:c,x:node.x+Math.cos(ang)*(r+10),y:node.y+Math.sin(ang)*(r+10)};
  });
  const ins=(pal.ports.in||[]).map((c,i,arr)=>{
    const n=arr.length; const frac=n===1?0.5:(i/(n-1));
    const ang = Math.PI - Math.PI*0.35 + frac*Math.PI*0.7; // west fan
    // normalize to -PI..PI: west fan centered at PI
    return {name:c,side:'in',contract:c,x:node.x+Math.cos(ang)*(r+10),y:node.y+Math.sin(ang)*(r+10)};
  });
  return {in:ins,out:outs};
}
function allPorts(){
  const out=[];
  nodes.forEach(n=>{
    const pp=portPositions(n);
    pp.in.forEach(p=>out.push({node:n,port:p}));
    pp.out.forEach(p=>out.push({node:n,port:p}));
  });
  return out;
}
function hitPort(world, onlySide){
  const r=9 / camera.scale;
  for(const {node,port} of allPorts()){
    if(onlySide && port.side!==onlySide) continue;
    const d=Math.hypot(world.x-port.x, world.y-port.y);
    if(d<=r+3) return {node,port};
  }
  return null;
}
function hitNode(world){
  let best=null,bd=Infinity;
  for(const n of nodes){
    const d=Math.hypot(n.x-world.x,n.y-world.y);
    const reach=radiusOf(n)+10/camera.scale;
    if(d<reach && d<bd){best=n;bd=d;}
  }
  return best;
}
function hitEdge(world){
  const thresh=8 / camera.scale;
  for(const e of edges){
    const s=byId.get(e.source),t=byId.get(e.target);
    if(!s||!t) continue;
    // sample bezier midpoint distance via 16 segments
    const pts=bezierPoints(s,t,16);
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1];
      const d=distToSeg(world,a,b);
      if(d<thresh) return e;
    }
  }
  return null;
}
function distToSeg(p,a,b){
  const vx=b.x-a.x, vy=b.y-a.y;
  const wx=p.x-a.x, wy=p.y-a.y;
  const c1=wx*vx+wy*vy;
  if(c1<=0) return Math.hypot(p.x-a.x,p.y-a.y);
  const c2=vx*vx+vy*vy;
  if(c2<=c1) return Math.hypot(p.x-b.x,p.y-b.y);
  const t=c1/c2;
  const px=a.x+t*vx, py=a.y+t*vy;
  return Math.hypot(p.x-px,p.y-py);
}
function bezierPoints(s,t, steps){
  const mx=(s.x+t.x)/2, my=(s.y+t.y)/2;
  const dx=t.x-s.x, dy=t.y-s.y;
  const len=Math.hypot(dx,dy)||1;
  const off=len*0.18;
  const nx=-dy/len, ny=dx/len;
  const cx=mx+nx*off, cy=my+ny*off;
  const pts=[];
  for(let i=0;i<=steps;i++){
    const tt=i/steps, u=1-tt;
    const x=u*u*s.x+2*u*tt*cx+tt*tt*t.x;
    const y=u*u*s.y+2*u*tt*cy+tt*tt*t.y;
    pts.push({x,y,cx,cy});
  }
  return pts;
}

// ---- draw -------------------------------------------------------------------
function draw(){
  const ratio=window.devicePixelRatio||1;
  const w=canvas.clientWidth, h=canvas.clientHeight;
  if(canvas.width!==w*ratio||canvas.height!==h*ratio){canvas.width=w*ratio;canvas.height=h*ratio;}
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.clearRect(0,0,w,h);
  // grid
  ctx.save();
  camera.apply(ctx);
  const scale=camera.scale;
  // grid dots at 20px world grid
  ctx.globalAlpha=0.12;
  ctx.fillStyle='#b8b0a6';
  const viewW=w/scale, viewH=h/scale;
  // approximate visible bounds by inverting camera translate
  // use simple world bounds expanding from center
  // draw grid in visible viewport approximated
  const topLeft=camera.toWorld({clientX:0,clientY:0},canvas);
  const botRight=camera.toWorld({clientX:w,clientY:h},canvas);
  const gx0=Math.floor(topLeft.x/GRID)*GRID, gx1=Math.ceil(botRight.x/GRID)*GRID;
  const gy0=Math.floor(topLeft.y/GRID)*GRID, gy1=Math.ceil(botRight.y/GRID)*GRID;
  for(let x=gx0;x<=gx1;x+=GRID) for(let y=gy0;y<=gy1;y+=GRID){
    ctx.beginPath(); ctx.arc(x,y,0.9/scale,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  // edges
  edges.forEach(e=>{
    const s=byId.get(e.source), t=byId.get(e.target);
    if(!s||!t) return;
    const col=CONTRACT_COLOR[e.contract]||'#999';
    const isSel=selected&&selected.type==='edge'&&selected.id===e.id;
    const isHover=hoverEdge&&hoverEdge.id===e.id;
    const pts=bezierPoints(s,t,24);
    const mx=(s.x+t.x)/2, my=(s.y+t.y)/2;
    const dx=t.x-s.x, dy=t.y-s.y, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len; const cx=mx+nx*len*0.18, cy=my+ny*len*0.18;
    ctx.beginPath();
    ctx.moveTo(s.x,s.y);
    ctx.quadraticCurveTo(cx,cy,t.x,t.y);
    ctx.strokeStyle=isSel? '#111' : col;
    ctx.lineWidth=(isSel?2.6:isHover?2.0:1.4)/scale;
    ctx.globalAlpha=isSel?1:0.85;
    ctx.stroke();
    // arrowhead at t
    const ang=Math.atan2(t.y-cy, t.x-cx);
    const ah=9/scale, aw=6/scale;
    ctx.beginPath();
    ctx.moveTo(t.x,t.y);
    ctx.lineTo(t.x - Math.cos(ang)*ah + Math.sin(ang)*aw, t.y - Math.sin(ang)*ah - Math.cos(ang)*aw);
    ctx.lineTo(t.x - Math.cos(ang)*ah - Math.sin(ang)*aw, t.y - Math.sin(ang)*ah + Math.cos(ang)*aw);
    ctx.closePath();
    ctx.fillStyle=isSel?'#111':col;
    ctx.globalAlpha=1;
    ctx.fill();
    // label
    const qx=0.25*s.x+0.5*cx+0.25*t.x, qy=0.25*s.y+0.5*cy+0.25*t.y;
    ctx.font=(10/scale)+'px ui-monospace,monospace';
    ctx.textAlign='center';
    ctx.fillStyle=isSel?'#111':col;
    const bgW=ctx.measureText(e.contract).width+6/scale;
    ctx.globalAlpha=0.92;
    ctx.fillStyle='#fff';
    ctx.fillRect(qx-bgW/2, qy-7/scale, bgW, 9/scale);
    ctx.fillStyle=isSel?'#111':col;
    ctx.fillText(e.contract, qx, qy);
    ctx.globalAlpha=1;
  });
  // preview line
  if(connectDrag){
    const s=connectDrag.fromNode;
    const spos=portPositions(s).out.find(p=>p.contract===connectDrag.contract) || {x:s.x,y:s.y};
    ctx.beginPath();
    ctx.moveTo(spos.x,spos.y);
    // bezier preview to cursor
    const mx=(spos.x+connectDrag.curWorld.x)/2, my=(spos.y+connectDrag.curWorld.y)/2;
    const dx=connectDrag.curWorld.x-spos.x, dy=connectDrag.curWorld.y-spos.y, len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len, cx=mx+nx*len*0.15, cy=my+ny*len*0.15;
    ctx.quadraticCurveTo(cx,cy,connectDrag.curWorld.x,connectDrag.curWorld.y);
    ctx.strokeStyle='#111';
    ctx.setLineDash([6/scale,4/scale]);
    ctx.lineWidth=1.6/scale;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  // nodes
  nodes.forEach(n=>{
    const isSel=selected&&selected.type==='node'&&selected.id===n.id;
    const isHover=hoverNode&&hoverNode.id===n.id;
    const r=radiusOf(n);
    const col=nodeColor(n.kind);
    ctx.beginPath();
    ctx.arc(n.x,n.y,r,0,Math.PI*2);
    ctx.fillStyle=isSel?'#111':isHover?'#222':col;
    ctx.globalAlpha=1;
    ctx.fill();
    ctx.lineWidth=(isSel?2.5:1.2)/scale;
    ctx.strokeStyle=isSel?'#facc15':'#fff';
    ctx.stroke();
    // label
    ctx.fillStyle='#fff';
    ctx.font='700 '+(11/scale)+'px ui-sans,system-ui';
    ctx.textAlign='center';
    const lbl=(n.label||n.kind).slice(0,18);
    ctx.fillText(lbl, n.x, n.y+3/scale);
    ctx.font=(9/scale)+'px ui-monospace,monospace';
    ctx.fillStyle='rgba(255,255,255,.78)';
    ctx.fillText(n.kind, n.x, n.y+12/scale);
    // ports
    const pp=portPositions(n);
    const all=[...pp.out,...pp.in];
    all.forEach(p=>{
      const isOut=p.side==='out';
      let compat=false, active=false;
      if(connectDrag){
        if(p.side==='in' && isCompatible(connectDrag.fromNode.kind, n.kind, connectDrag.contract) && p.contract===connectDrag.contract) compat=true;
        if(hoverPort && hoverPort.node.id===n.id && hoverPort.port.name===p.name) active=true;
      }
      const pr=6/scale;
      ctx.beginPath();
      ctx.arc(p.x,p.y, compat? pr+2/scale : pr,0,Math.PI*2);
      ctx.fillStyle= compat? '#111' : (isOut? '#1f2937':'#fff');
      ctx.globalAlpha=1;
      ctx.fill();
      ctx.strokeStyle= compat? '#facc15' : CONTRACT_COLOR[p.contract]||'#999';
      ctx.lineWidth=(compat?2.2:1.4)/scale;
      ctx.stroke();
      if(compat){ ctx.beginPath(); ctx.arc(p.x,p.y, pr+5/scale,0,Math.PI*2); ctx.strokeStyle='rgba(250,204,21,.35)'; ctx.lineWidth=1.8/scale; ctx.stroke(); }
    });
  });
  ctx.restore();
}

function refreshInspector(){
  if(!selected){ inspector.classList.remove('open'); inspector.replaceChildren(); return; }
  inspector.classList.add('open');
  inspector.replaceChildren();
  const close=document.createElement('button'); close.className='close'; close.textContent='×'; close.setAttribute('aria-label','Close');
  close.addEventListener('click',()=>{selected=null;refreshInspector();draw();});
  inspector.append(close);
  if(selected.type==='node'){
    const n=byId.get(selected.id);
    if(!n){selected=null;refreshInspector();return;}
    const pal=paletteById.get(n.kind);
    const k=document.createElement('p'); k.className='kicker'; k.textContent=(pal?pal.category:'')+' · '+n.kind; inspector.append(k);
    const h=document.createElement('h2'); h.textContent=n.label; h.style.fontSize='14px'; inspector.append(h);
    if(pal){ const d=document.createElement('p'); d.textContent=pal.description; d.style.color='var(--ink-faint)'; d.style.fontSize='12px'; inspector.append(d); }
    const pos=document.createElement('p'); pos.textContent='x '+Math.round(n.x)+'  y '+Math.round(n.y)+'  degree '+n.degree; pos.style.font='11px ui-monospace,monospace'; pos.style.color='var(--ink-faint)'; inspector.append(pos);
    const outs=(pal?pal.ports.out:[]).join(', ')||'—'; const ins=(pal?pal.ports.in:[]).join(', ')||'—';
    const p1=document.createElement('p'); p1.style.font='11px ui-monospace,monospace'; p1.textContent='out: '+outs; inspector.append(p1);
    const p2=document.createElement('p'); p2.style.font='11px ui-monospace,monospace'; p2.textContent='in: '+ins; inspector.append(p2);
  } else {
    const e=edges.find(x=>x.id===selected.id);
    if(!e){selected=null;refreshInspector();return;}
    const k=document.createElement('p'); k.className='kicker'; k.textContent='edge · '+e.contract; inspector.append(k);
    const h=document.createElement('h2'); h.textContent=e.source+' → '+e.target; h.style.fontSize='13px'; inspector.append(h);
    const s=byId.get(e.source), t=byId.get(e.target);
    const legal=s&&t? legalContracts(s.kind,t.kind):[];
    const p=document.createElement('p'); p.style.font='11px ui-monospace,monospace'; p.textContent='legal: '+(legal.join(', ')||'none')+' — click edge to cycle'; inspector.append(p);
    const c=document.createElement('p'); c.textContent='contract: '+e.contract; c.style.font='12px ui-monospace,monospace'; inspector.append(c);
  }
}
function refreshStatus(msg){
  document.getElementById('stat-nodes').textContent=nodes.length+' nodes';
  document.getElementById('stat-edges').textContent=edges.length+' edges';

// ---- create node ------------------------------------------------------------
function snap(v){ return Math.round(v/GRID)*GRID; }
function isColliding(x,y, ignoreId){
  for(const n of nodes){
    if(n.id===ignoreId) continue;
    if(Math.hypot(n.x-x, n.y-y) < radiusOf(n)+28) return true;
  }
  return false;
}
function nudgeFree(x,y){
  if(!isColliding(x,y)) return {x,y};
  for(let r=GRID; r<400; r+=GRID){
    for(let ang=0; ang<Math.PI*2; ang+=Math.PI/4){
      const nx=snap(x+Math.cos(ang)*r), ny=snap(y+Math.sin(ang)*r);
      if(!isColliding(nx,ny)) return {x:nx,y:ny};
    }
  }
  return {x,y};
}
function createNode(kind, world){
  const pal=paletteById.get(kind);
  if(!pal) return null;
  const p=nudgeFree(snap(world.x), snap(world.y));
  const id='n'+(nextNodeId++);
  const node={id, kind, label:pal.label, x:p.x, y:p.y, degree:0};
  nodes.push(node); byId.set(id,node);
  recomputeDegrees();
  selected={type:'node', id}; refreshInspector(); refreshStatus('created '+kind); draw();
  return node;
}

// ---- save / load ------------------------------------------------------------
function topologyJSON(){
  return {
    version:1,
    metadata:{created_at:TOPO.metadata.created_at, updated_at:new Date().toISOString(), author:TOPO.metadata.author||'operator', description:TOPO.metadata.description||''},
    nodes:nodes.map(n=>({id:n.id,kind:n.kind,label:n.label,position:{x:Math.round(n.x),y:Math.round(n.y)}})),
    edges:edges.map(e=>({id:e.id,source:e.source,source_port:e.source_port,target:e.target,target_port:e.target_port,contract:e.contract,label:e.label||''}))
  };
}
function doDownload(){
  const blob=new Blob([JSON.stringify(topologyJSON(),null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='topology.json'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),500);
  refreshStatus('downloaded topology.json');
}
async function doSave(){
  const data=JSON.stringify(topologyJSON(),null,2);
  if('showSaveFilePicker' in window){
    try{
      const handle=await window.showSaveFilePicker({suggestedName:'topology.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      const w=await handle.createWritable(); await w.write(data); await w.close();
      refreshStatus('saved via File System Access API'); return;
    }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  doDownload();
}
async function doCopy(){
  const txt=JSON.stringify(topologyJSON(),null,2);
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(txt); refreshStatus('copied JSON to clipboard'); return; }
  }catch(e){}
  // fallback execCommand
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  const ok=document.execCommand('copy'); ta.remove();
  refreshStatus(ok?'copied JSON (execCommand)':'copy failed — use Export');
}
function loadTopology(obj){
  if(!obj||!Array.isArray(obj.nodes)||!Array.isArray(obj.edges)) throw new Error('invalid topology');
  nodes.length=0; edges.length=0; byId.clear();
  obj.nodes.forEach(n=>{ const nd={id:n.id,kind:n.kind,label:n.label||n.kind,x:n.position.x,y:n.position.y,degree:0}; nodes.push(nd); byId.set(nd.id,nd); });
  obj.edges.forEach(e=>edges.push({id:e.id,source:e.source,target:e.target,source_port:e.source_port||'out',target_port:e.target_port||'in',contract:e.contract,label:e.label||''}));
  nextNodeId=nodes.length+1; nextEdgeId=edges.length+1;
  recomputeDegrees(); selected=null; refreshInspector(); refreshStatus('loaded '+nodes.length+' nodes'); draw(); fitSoon();
}
function fitSoon(){ camera.fit(nodes, canvas.clientWidth, canvas.clientHeight); draw(); }

// ---- interaction ------------------------------------------------------------
canvas.addEventListener('pointerdown', e=>{
  canvas.setPointerCapture(e.pointerId);
  const world=camera.toWorld(e, canvas);
  // check port first for connect
  const hp=hitPort(world,'out');
  if(hp){
    connectDrag={fromNode:hp.node, contract:hp.port.contract, curWorld:world};
    hoverPort=null; e.preventDefault(); return;
  }
  // node drag?
  const hn=hitNode(world);
  if(hn){
    if(selected&&selected.type==='node'&&selected.id===hn.id){
      nodeDrag={node:hn, offX:world.x-hn.x, offY:world.y-hn.y};
    } else {
      // allow dragging node immediately as well, but record selection
      nodeDrag={node:hn, offX:world.x-hn.x, offY:world.y-hn.y};
    }
    selected={type:'node',id:hn.id}; refreshInspector();
    draw(); return;
  }
  // edge click?
  const he=hitEdge(world);
  if(he){
    selected={type:'edge',id:he.id}; refreshInspector(); draw(); return;
  }
  // pan start or deselect
  if(e.button===0){
    // click empty deselects unless connect drag
    panDrag={x:e.clientX,y:e.clientY,moved:false};
    // don't clear selection immediately; on pointerup if not moved will clear
  }
});
canvas.addEventListener('pointermove', e=>{
  const world=camera.toWorld(e, canvas);
  if(connectDrag){
    connectDrag.curWorld=world;
    const hp=hitPort(world,'in');
    if(hp && isCompatible(connectDrag.fromNode.kind, hp.node.kind, connectDrag.contract) && hp.port.contract===connectDrag.contract){
      hoverPort=hp;
    } else hoverPort=null;
    draw(); return;
  }
  if(nodeDrag){
    let nx=snap(world.x-nodeDrag.offX), ny=snap(world.y-nodeDrag.offY);
    // nudge not needed during drag, but avoid snapping atop others? allow overlap during drag
    nodeDrag.node.x=nx; nodeDrag.node.y=ny;
    draw(); return;
  }
  if(panDrag){
    const dx=e.clientX-panDrag.x, dy=e.clientY-panDrag.y;
    if(Math.abs(dx)+Math.abs(dy)>3) panDrag.moved=true;
    camera.panBy(dx,dy);
    panDrag.x=e.clientX; panDrag.y=e.clientY;
    draw(); return;
  }
  // hover
  const hpOut=hitPort(world);
  const hn=hitNode(world);
  const he=!hn&&!hpOut? hitEdge(world):null;
  let changed=false;
  if((hn&&hoverNode&&hn.id!==hoverNode.id)||(!hn&&hoverNode)||(hn&&!hoverNode)) {hoverNode=hn; changed=true;}
  if((he&&hoverEdge&&he.id!==hoverEdge.id)||(!he&&hoverEdge)||(he&&!hoverEdge)) {hoverEdge=he; changed=true;}
  canvas.style.cursor = hpOut? 'crosshair' : hn? 'grab' : he? 'pointer' : 'default';
  if(changed&&!connectDrag&&!nodeDrag) draw();
});
canvas.addEventListener('pointerup', e=>{
  const world=camera.toWorld(e, canvas);
  if(connectDrag){
    const hp=hitPort(world,'in');
    if(hp && isCompatible(connectDrag.fromNode.kind, hp.node.kind, connectDrag.contract) && hp.port.contract===connectDrag.contract){
      // create edge; if ctrl/meta and multiple legal, cycle
      const s=connectDrag.fromNode, t=hp.node;
      let contract=connectDrag.contract;
      const legal=legalContracts(s.kind,t.kind);
      if(legal.length>1 && (e.ctrlKey||e.metaKey)){
        const idx=legal.indexOf(contract);
        contract=legal[(idx+1)%legal.length];
      }
      // prevent duplicate
      const exists=edges.some(ed=>ed.source===s.id&&ed.target===t.id&&ed.contract===contract);
      if(!exists){
        const id='e'+(nextEdgeId++);
        edges.push({id,source:s.id,target:t.id,source_port:contract,target_port:contract,contract,label:''});
        recomputeDegrees();
        selected={type:'edge',id}; refreshInspector(); refreshStatus('edge '+contract);
      } else refreshStatus('edge already exists');
    }
    connectDrag=null; hoverPort=null; draw(); return;
  }
  if(nodeDrag){
    // collision nudge after drop
    const n=nodeDrag.node;
    if(isColliding(n.x,n.y,n.id)){
      const p=nudgeFree(n.x,n.y); n.x=p.x; n.y=p.y;
    }
    nodeDrag=null; recomputeDegrees(); draw(); return;
  }
  if(panDrag){
    const wasDrag=panDrag.moved; panDrag=null;
    if(!wasDrag){
      const he=hitEdge(world);
      if(he){
        // cycle contract
        const s=byId.get(he.source), t=byId.get(he.target);
        if(s&&t){
          const legal=legalContracts(s.kind,t.kind);
          if(legal.length>1){
            const idx=legal.indexOf(he.contract);
            he.contract=legal[(idx+1)%legal.length];
            he.source_port=he.contract; he.target_port=he.contract;
            selected={type:'edge',id:he.id}; refreshInspector(); refreshStatus('cycled to '+he.contract); draw(); return;
          }
        }
        selected={type:'edge',id:he.id}; refreshInspector(); draw(); return;
      }
      const hn=hitNode(world);
      if(hn){ selected={type:'node',id:hn.id}; refreshInspector(); draw();}
      else { selected=null; refreshInspector(); draw();}
    }
    return;
  }
});
canvas.addEventListener('pointerleave',()=>{
  if(connectDrag){ /* keep */ }
  panDrag=null;
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  camera.zoomAt(e.clientX-rect.left, e.clientY-rect.top, Math.exp(-e.deltaY*0.0016));
  draw();
},{passive:false});
canvas.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ connectDrag=null; hoverPort=null; selected=null; refreshInspector(); draw(); }
  if(e.key==='Delete'||e.key==='Backspace'){
    if(selected){
      if(selected.type==='node'){
        const id=selected.id;
        // remove edges
        for(let i=edges.length-1;i>=0;i--) if(edges[i].source===id||edges[i].target===id) edges.splice(i,1);
        const idx=nodes.findIndex(n=>n.id===id); if(idx>=0) nodes.splice(idx,1); byId.delete(id);
        recomputeDegrees(); selected=null; refreshInspector(); refreshStatus('deleted node'); draw();
      } else if(selected.type==='edge'){
        const idx=edges.findIndex(ed=>ed.id===selected.id); if(idx>=0) edges.splice(idx,1);
        recomputeDegrees(); selected=null; refreshInspector(); refreshStatus('deleted edge'); draw();
      }
      e.preventDefault();
    }
  }
  if(e.key==='+'||e.key==='='){ camera.zoomAt(canvas.clientWidth/2,canvas.clientHeight/2,1.2); draw();}
  if(e.key==='-'||e.key==='_'){ camera.zoomAt(canvas.clientWidth/2,canvas.clientHeight/2,0.833); draw();}
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && (connectDrag||selected)){ connectDrag=null; hoverPort=null; selected=null; refreshInspector(); draw();}
  if((e.key==='Delete'||e.key==='Backspace') && selected && e.target===document.body){

  }
});

  const hint=document.getElementById('save-hint');
  if('showSaveFilePicker' in window) hint.textContent='Save: File System Access API';
  else if(window.isSecureContext) hint.textContent='Save: download fallback (no FS Access)';
  else hint.textContent='Save: download fallback (file:// blocks picker — use localhost)';
})();
canvas.focus();
</script>
</body>
